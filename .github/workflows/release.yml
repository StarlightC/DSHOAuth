name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag belongs to source
        run: |
          git fetch origin source
          git merge-base --is-ancestor HEAD origin/source
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/, 'Use a stable or prerelease version without build metadata')
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag must match package.json version')
          assert.equal(lock.version, pkg.version, 'Lockfile version must match')
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile root version must match')
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack release asset
        run: |
          npm pack --json > pack-result.json
          node --input-type=module <<'JS'
          import { readFileSync, renameSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const [pack] = JSON.parse(readFileSync('pack-result.json', 'utf8'))
          for (const path of ['lib/index.js', 'lib/client.js', 'cordis.patch.yml', 'package.json']) {
            assert.ok(pack.files.some(file => file.path === path), `Missing release file: ${path}`)
          }
          renameSync(pack.filename, 'dsh-oauth.tgz')
          JS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A retry must synchronize the already published asset, not replace it.
            gh release download "$RELEASE_TAG" --pattern dsh-oauth.tgz \
              --output dsh-oauth.tgz --clobber
          else
            gh release create "$RELEASE_TAG" dsh-oauth.tgz \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
      - name: Synchronize stable release to main
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/publish-main.mjs dsh-oauth.tgz
